name: CI/CD Laravel DevSecOps (SQLite)

on:
  push:
    branches: [main, dev, feature]
  pull_request:
    branches: [main, dev]

env:
  DB_CONNECTION: sqlite
  DB_DATABASE: /github/workspace/database/database.sqlite

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🗄️ Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, sqlite3, zip, tokenizer, xml, curl
          coverage: pcov

      - name: 📦 Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🛠️ Setup SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite
          chmod 777 database/database.sqlite
          cp .env.example .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          php artisan key:generate

      - name: 🔐 Analyse Statique (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: 📊 OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Laravel Project'
          scanpath: '.'
          format: 'HTML'
          out: './security-report'
          failOnCVSS: 7

      - name: 📃 Afficher rapport de sécurité
        run: ls -la ./security-report

      - name: 🧪 Run Tests
        run: |
          php artisan migrate:fresh --force
          php artisan test

      - name: 🐳 Build Docker Image
        run: docker build -t laravel-app .

      - name: 🧪 Tests OWASP TOP 10
        if: fileExists('check-owasp.sh')
        run: bash check-owasp.sh

      - name: 🚀 Déploiement Staging
        if: github.ref == 'refs/heads/main'
        run: echo "Déploiement staging via Render/Heroku ou Docker"

      - name: 📝 Validation Manuelle
        run: |
          echo "Checklist manuelle :"
          echo "- Injection SQL testée ?"
          echo "- XSS testée ?"
          echo "- Sécurité HTTPS vérifiée ?"
          echo "- Authentification robuste OK ?"
          echo "- Logs & monitoring actifs ?"

      - name: 📦 Archive Rapport OWASP
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite-${{ github.run_number }}
          path: ./security-report
