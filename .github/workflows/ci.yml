name: CI/CD Laravel DevSecOps

on:
  push:
    branches:
      - main
      - dev
      - feature
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, zip, tokenizer, xml, curl

      - name: 📦 Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: 🔐 Analyse Statique (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: 📊 OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Laravel Project'
          scanpath: '.'
          format: 'HTML'
          out: './security-report'
          failOnCVSS: 7

      - name: 📃 Afficher rapport de sécurité
        run: ls -la ./security-report

      - name: 🧪 Run PHPUnit Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --testsuite=Unit

      - name: 🐳 Build Docker Image
        run: docker build -t laravel-app .

      - name: 🧪 Tests OWASP TOP 10
        run: bash check-owasp.sh

      - name: 🚀 Déploiement Staging
        if: github.ref == 'refs/heads/main'
        run: echo "Déploiement staging via Render/Heroku ou Docker"

      - name: 📝 Validation Manuelle
        run: |
          echo "Checklist manuelle :"
          echo "- Injection SQL testée ?"
          echo "- XSS testée ?"
          echo "- Sécurité HTTPS vérifiée ?"
          echo "- Authentification robuste OK ?"
          echo "- Logs & monitoring actifs ?"

      - name: 📦 Archive Rapport OWASP
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite
          path: ./security-report
